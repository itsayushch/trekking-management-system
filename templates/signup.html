{% extends 'base.html' %}

{% block title %}Register - Trekking Management{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-4">Create an Account</h4>

                <form method="POST" action="{{ url_for('signup') }}">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Register As</label>
                        <select name="role" class="form-select" required>
                            <option value="trekker">Trekker</option>
                            <option value="staff">Trek Staff</option>
                        </select>
                        <div class="form-text">
                            Trek Staff accounts need to be approved by the Admin before login.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    Already registered? <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>

    </div>
</div>

{% endblock %}
