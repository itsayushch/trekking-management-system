{% extends 'base.html' %}

{% block title %}Create Trek{% endblock %}

{% block content %}

<h2 class="mb-4">Create New Trek</h2>

<div class="card">
<div class="card-body">

<form method="POST" action="{{ url_for('admin.create_trek') }}" id="trekForm">

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Difficulty</label>
            <select name="difficulty" class="form-select" required>
                <option value="Easy">Easy</option>
                <option value="Moderate">Moderate</option>
                <option value="Hard">Hard</option>
            </select>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Duration (days)</label>
            <input type="number" name="duration_days" class="form-control" min="1" required>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" name="available_slots" class="form-control" min="0" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" id="start_date" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" id="end_date" class="form-control">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Assign Staff (optional)</label>
        <select name="assigned_staff_id" class="form-select">
            <option value="">-- Not assigned yet --</option>
            {% for staff in staff_options %}
                <option value="{{ staff.id }}">{{ staff.name }} ({{ staff.email }})</option>
            {% endfor %}
        </select>
        <div class="form-text">Only approved staff show up here.</div>
    </div>

    <button type="submit" class="btn btn-primary">Create Trek</button>
    <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-outline-secondary">Cancel</a>
</form>

</div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('trekForm').addEventListener('submit', function (e) {
        var start = document.getElementById('start_date').value;
        var end = document.getElementById('end_date').value;

        if (start && end && end < start) {
            e.preventDefault();
            alert('End date cannot be before the start date.');
        }
    });
</script>
{% endblock %}
