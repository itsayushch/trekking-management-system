{% extends 'base.html' %}

{% block title %}Add Staff{% endblock %}

{% block content %}

<h2 class="mb-4">Add Staff Member</h2>

<div class="card">
<div class="card-body">

<form method="POST" action="{{ url_for('admin.add_staff') }}">

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
            <div class="form-text">At least 6 characters. Staff can change it later from their profile.</div>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Contact Details (optional)</label>
            <input type="text" name="contact_details" class="form-control">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Add Staff</button>
    <a href="{{ url_for('admin.manage_staff') }}" class="btn btn-outline-secondary">Cancel</a>
</form>

</div>
</div>

{% endblock %}
