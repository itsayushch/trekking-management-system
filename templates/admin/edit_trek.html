{% extends 'base.html' %}

{% block title %}Edit Trek{% endblock %}

{% block content %}

<h2 class="mb-4">Edit Trek - {{ trek.name }}</h2>

<div class="card">
<div class="card-body">

<form method="POST" action="{{ url_for('edit_trek', id=trek.id) }}" id="trekForm">

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Difficulty</label>
            <select name="difficulty" class="form-select" required>
                {% for level in ['Easy', 'Moderate', 'Hard'] %}
                    <option value="{{ level }}" {% if trek.difficulty == level %}selected{% endif %}>{{ level }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Duration (days)</label>
            <input type="number" name="duration_days" class="form-control" value="{{ trek.duration_days }}" min="1" required>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" min="0" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" id="start_date" class="form-control" value="{{ trek.start_date or '' }}">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" id="end_date" class="form-control" value="{{ trek.end_date or '' }}">
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                {% for st in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                    <option value="{{ st }}" {% if trek.status == st %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Assigned Staff</label>
            <select name="assigned_staff_id" class="form-select">
                <option value="">-- Not assigned --</option>
                {% for staff in staff_options %}
                    <option value="{{ staff.id }}" {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                        {{ staff.name }} ({{ staff.email }})
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('manage_treks') }}" class="btn btn-outline-secondary">Cancel</a>
</form>

</div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.getElementById('trekForm').addEventListener('submit', function (e) {
        var start = document.getElementById('start_date').value;
        var end = document.getElementById('end_date').value;

        if (start && end && end < start) {
            e.preventDefault();
            alert('End date cannot be before the start date.');
        }
    });
</script>
{% endblock %}
